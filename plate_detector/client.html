<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placas Perú - Bootstrap</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #0a0a0a;
    }

    .app-container {
      background: #1a1a1a;
      border-radius: 24px;
      padding: 16px;
      color: white;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .camera-box {
      background: #000;
      border-radius: 16px;
      aspect-ratio: 4/3;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .plate-number {
      font-family: monospace;
      font-size: 1.6rem;
      font-weight: bold;
      color: #e94560;
      letter-spacing: 2px;
    }

    .status {
      font-size: 0.75rem;
      background: #222;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .badge-custom {
      background: #e94560;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
    }

    .guide {
      font-size: 0.75rem;
      color: #ffd700;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container-fluid py-4">
  <div class="row g-3">

    <!-- COLUMNA IZQUIERDA -->
    <div class="col-md-6">
      <div class="app-container">

        <div class="text-center mb-3">
          <h4 class="mb-0">🇵🇪 Lector de Placas</h4>
          <small class="text-secondary">Modo rápido | Sin lag</small>
        </div>

        <div class="camera-box mb-3">
          <canvas id="canvas"></canvas>
        </div>

        <div class="d-flex gap-2 mb-3">
          <button id="startBtn" class="btn btn-danger w-100">📷 Iniciar</button>
          <button id="stopBtn" class="btn btn-secondary w-100" disabled>⏹️ Detener</button>
        </div>

        <div class="bg-black p-3 rounded mb-3 text-center">
          <div class="plate-number" id="plateText">———</div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="status" id="status">⚪ Desconectado</span>
          <span class="badge-custom" id="fps">📊 0 fps</span>
          <span class="badge-custom" id="latency">⚡ 0 ms</span>
        </div>

        <div class="guide">
          💡 Consejos para mejor rendimiento:<br>
          • Buena iluminación<br>
          • 20-30cm de distancia<br>
          • Fondo claro
        </div>

      </div>
    </div>

    <!-- COLUMNA DERECHA (VACÍA) -->
    <div class="col-md-6">
      <div class="app-container">

        <div class="text-center mb-3">
          <h4 class="mb-0">Datos del Vehículo</h4>
        </div>

        <div class="camera-box mb-3" id="car-info">
        </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Elementos
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const plateTextSpan = document.getElementById('plateText');
    const statusSpan = document.getElementById('status');
    const fpsSpan = document.getElementById('fps');
    const latencySpan = document.getElementById('latency');
    
    // Configuración
    const WS_URL = `ws://${window.location.hostname}:8765`;
    
    // Estado
    let stream = null;
    let ws = null;
    let isActive = false;
    let video = null;
    let frameInterval = null;

    let lastPlate = null;
    let plateLock = false;
    
    // Métricas
    let frameCount = 0;
    let lastFpsTime = 0;
    
    canvas.width = 480;
    canvas.height = 360;

    async function buscarPlaca(placa) {
        const url = `http://localhost:4567/${placa}`;

        const container = document.getElementById("car-info");

        container.innerHTML = `<div class="text-white p-3">Consultando...</div>`;

        try {
            const res = await fetch(url);

            const data = await res.json();

            if (res.ok) {
            const v = data.value;

            container.innerHTML = `
                <div class="p-3 text-light">
                <h5 class="mb-2 text-success">✔ Vehículo encontrado</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item bg-dark text-light">Placa: <b>${data.key}</b></li>
                    <li class="list-group-item bg-dark text-light">Marca: ${v.marca}</li>
                    <li class="list-group-item bg-dark text-light">Modelo: ${v.modelo}</li>
                    <li class="list-group-item bg-dark text-light">Color: ${v.color}</li>
                    <li class="list-group-item bg-dark text-light">Año: ${v.anio}</li>
                </ul>
                </div>
            `;
            } else {
            container.innerHTML = `
                <div class="p-3 text-danger">
                ❌ ${data.error || "Error desconocido"}
                </div>
            `;
            }

        } catch (err) {
            container.innerHTML = `
            <div class="p-3 text-warning">
                ⚠ Error de conexión con el servidor
            </div>
            `;
        }
    }
            
    // Iniciar
    async function start() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: 480 },
                    height: { ideal: 360 },
                    facingMode: 'environment'
                }
            });
            
            video = document.createElement('video');
            video.srcObject = stream;
            video.playsInline = true;
            await video.play();
            
            isActive = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            
            connectWebSocket();
            
            // Capturar frames cada 50ms (20 fps)
            frameInterval = setInterval(captureFrame, 50);
            
            statusSpan.innerHTML = '📡 Activo';
            
        } catch (err) {
            console.error(err);
            statusSpan.innerHTML = '❌ Error';
            alert('No se pudo acceder a la cámara');
        }
    }
    
    // Capturar y enviar frame
    function captureFrame() {
        if (!isActive || !video || video.videoWidth === 0) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        
        // Dibujar preview
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Capturar frame para enviar
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = video.videoWidth;
        tempCanvas.height = video.videoHeight;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(video, 0, 0);
        
        // Comprimir antes de enviar (70% calidad)
        const base64 = tempCanvas.toDataURL('image/jpeg', 0.7).split(',')[1];
        
        ws.send(JSON.stringify({
            type: 'frame',
            image: base64
        }));
        
        // FPS
        frameCount++;
        const now = Date.now();
        if (now - lastFpsTime >= 1000) {
            fpsSpan.innerHTML = `📊 ${frameCount} fps`;
            frameCount = 0;
            lastFpsTime = now;
        }
    }

    // WebSocket
    function connectWebSocket() {
        if (ws) ws.close();
        
        ws = new WebSocket(WS_URL);
        
        ws.onopen = () => {
            statusSpan.innerHTML = '✅ Conectado';
        };
        
        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);

                if (data.type === 'detection') {

                    if (data.plate) {

                        plateTextSpan.innerHTML = data.plate;

                        // 🚨 SOLO UNA VEZ POR PLACA
                        if (data.plate !== lastPlate && !plateLock) {

                            lastPlate = data.plate;
                            plateLock = true;

                            buscarPlaca(data.plate);

                            // desbloquear después de X segundos
                            setTimeout(() => {
                                plateLock = false;
                            }, 5000); // evita spam por 5 segundos
                        }

                    } else {
                        plateTextSpan.innerHTML = '🔍 Buscando...';
                    }

                    if (data.process_time) {
                        latencySpan.innerHTML = `⚡ ${data.process_time} ms`;
                    }
                }

            } catch (e) {
                console.error(e);
            }
        };
        
        ws.onerror = () => {
            statusSpan.innerHTML = '⚠️ Error';
        };
        
        ws.onclose = () => {
            if (isActive) {
                statusSpan.innerHTML = '🔄 Reconectando...';
                setTimeout(connectWebSocket, 2000);
            } else {
                statusSpan.innerHTML = '⚪ Desconectado';
            }
        };
    }
    
    // Detener
    function stop() {
        isActive = false;
        
        if (frameInterval) clearInterval(frameInterval);
        if (stream) stream.getTracks().forEach(t => t.stop());
        if (ws) ws.close();
        
        startBtn.disabled = false;
        stopBtn.disabled = true;
        
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        plateTextSpan.innerHTML = '———';
        statusSpan.innerHTML = '⚪ Detenido';
        fpsSpan.innerHTML = '📊 0 fps';
        latencySpan.innerHTML = '⚡ 0 ms';
    }
    
    startBtn.addEventListener('click', start);
    stopBtn.addEventListener('click', stop);
    
    window.addEventListener('beforeunload', () => stop());
    
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = '14px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('🇵🇪 Presiona "Iniciar"', canvas.width/2, canvas.height/2);
</script>
</body>
</html>
